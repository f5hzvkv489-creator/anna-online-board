<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anna Board v5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
<div class="brand">📚 Anna Board</div>
<input type="color" id="colorPicker" value="#7c5cff">
<label>Перо <input type="range" id="penSize" min="1" max="20" value="3"></label>
<label>Ластик <input type="range" id="eraserSize" min="5" max="80" value="24"></label>
<button data-tool="pen">Перо</button>
<button data-tool="eraser">Ластик</button>
<button data-tool="text">Текст</button>
<button data-tool="line">Линия</button>
<button data-tool="rect">Прямоугольник</button>
<button data-tool="circle">Круг</button>
<button id="newBoard">Новая доска</button>
<button id="clearBtn">Очистить</button>
</header>
<div class="boardinfo">ID доски: <span id="boardId"></span></div>
<div class="workspace"><canvas id="board"></canvas></div>
<script src="app.js"></script>
</body></html>
